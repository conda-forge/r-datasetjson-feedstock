{% set version = "0.4.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-datasetjson
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/datasetjson_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/datasetjson/datasetjson_{{ version }}.tar.gz
  sha256: c01f720b748cc11dd3188ea23852c518c4dbd20ece4295accefd4b95c067ad7e

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-hms
    - r-jsonvalidate >=1.3.1
    - r-yyjsonr >=0.1.18
  run:
    - r-base
    - r-hms
    - r-jsonvalidate >=1.3.1
    - r-yyjsonr >=0.1.18

test:
  commands:
    - $R -e "library('datasetjson')"           # [not win]
    - "\"%R%\" -e \"library('datasetjson')\""  # [win]

about:
  home: https://atorus-research.github.io/datasetjson/
  license: Apache-2.0
  summary: Read, construct and write CDISC (Clinical Data Interchange Standards Consortium) Dataset JSON (JavaScript Object Notation) files, while validating per the Dataset JSON schema file, as described in CDISC (2023) <https://www.cdisc.org/standards/data-exchange/dataset-json>.
  license_family: APACHE
  license_file:
    - LICENSE-2.0.txt

extra:
  recipe-maintainers:
    - conda-forge/r
